# Publica o site no GitHub Pages a cada push na branch main
# e também às 7h e 12h (horário de Brasília), para liberar os artigos agendados.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "2 10 * * *"   # 7h02 BRT
    - cron: "2 15 * * *"   # 12h02 BRT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
